# Test sweep config if needed
# All values should be change or atleast look at.

program: train_vertexAI.py
name: MEGA_SWEEP
project: SWEEP_22012025 
entity: DTUGroup14 
method: bayes  # Options: grid, random, bayes
seed: 42
model_path: "models/"


metric:
  goal: maximize
  name: val_accuracy

parameters:
  architecture:
    values: [resnet18] #mobilenetv3
  pretrained:
    values: [true]

  optimizer:
    values: [sgd, adam]
  learning_rate:
    min: 0.0001
    max: 0.1
    distribution: log_uniform
  momentum:
    min: 0.8
    max: 0.99
    distribution: uniform  
  weight_decay:
    min: 1e-5
    max: 1e-2
    distribution: log_uniform

  lr_scheduler:
    values: [step]
  step_size:
    values: [5, 10, 20] 

  batch_size:
    values: [16, 32, 64]
  epochs:
    values: [15]
