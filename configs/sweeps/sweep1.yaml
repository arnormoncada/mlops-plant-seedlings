# Test sweep config if needed
# All values should be change or atleast look at.

program: train_vertexAI.py
name: MEGA_SWEEP
project: SWEEP_22012025 
entity: DTUGroup14 
method: bayes  # Options: grid, random, bayes


metric:
  goal: maximize
  name: val_accuracy

parameters:
  architecture:
    values: ["resnet18","mobilenetv3_small_050"] #mobilenetv3
  pretrained:
    values: [true]
  num_classes:
    values: [12]  # Number of classes in your dataset
  optimizer:
    values: [SGD, Adam]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  momentum:
    distribution: uniform
    min: 0.8
    max: 0.99    
  weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-2
  lr_scheduler:
    values: [step]
  step_size:
    values: [5, 10, 20] 

  batch_size:
    values: [16, 32, 64]
  epochs:
    values: [1]
